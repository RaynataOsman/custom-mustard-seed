<div role="status" aria-live="polite" id="toast" class="fixed bottom-4 right-4 hidden card px-4 py-3 text-sm shadow-lg"></div>

<script>
const TABS=[["add","Add a job"],["review","Review"],["needs","Needs you"],["applied","Applied"],["referrals","Referrals"],["found","All found"],["boards","Boards"],["run","Runs"],["settings","Settings"]];
let PREFILL=null;{const h=location.hash.slice(1);if(h.startsWith("add&")){const p=new URLSearchParams(h.slice(4));PREFILL={url:p.get("u")||"",text:p.get("t")||""};history.replaceState(null,"","#add")}}
let tab=(location.hash.slice(1)||"review").split("&")[0], OV=null, HEALTH=null, CURRUN=null;
const $=s=>document.querySelector(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api=async(p,b)=>{const r=await fetch(p,b?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}:{});let data;try{data=await r.json()}catch{throw new Error("The server returned an unreadable response.")}if(!r.ok||data?.ok===false)throw new Error(data.error||`Request failed (${r.status})`);return data};
const windowApi=api;
window.addEventListener("unhandledrejection",event=>{event.preventDefault();toast(event.reason?.message||"Something went wrong. Please try again.")});
function syncTheme(){const dark=document.documentElement.dataset.theme==='dark';$("#theme-toggle").textContent=dark?'Light mode':'Dark mode';$("#theme-toggle").setAttribute('aria-pressed',String(dark))}
function toggleTheme(){const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;try{localStorage.setItem('mustard-theme',theme)}catch{}syncTheme()}
syncTheme();
const DESCRIPTIONS={add:"Bring an opportunity. Build your next step.",review:"A little attention here can open a new door. Review each role before approving.",needs:"These applications need your personal touch.",applied:"Every application is a seed planted. Keep track of your progress.",referrals:"Start a conversation with the people behind the opportunity.",found:"Explore the roles discovered for you and see how they fit.",boards:"See where your opportunities come from and which sources need attention.",run:"Start a task and follow its progress here.",settings:"Make this workspace yours. Manage your profile, resumes and connections."};
function drawHeading(){$("#page-title").textContent=TABS.find(([k])=>k===tab)?.[1]||'Review';$("#page-description").textContent=DESCRIPTIONS[tab]||''}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.remove("hidden");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.add("hidden"),3500)}
function drawTabs(){$("#tabs").innerHTML=TABS.map(([k,l])=>{let n="";if(OV){const c=OV.counts;n=k=="review"?(c.ready||0):k=="needs"?(c.needs_you||0):k=="applied"?(c.submitted||0):k=="referrals"?OV.contacts_pending:"";}
 return `<button type="button" class="tab ${tab==k?"active":""}" aria-current="${tab==k?"page":"false"}" onclick="go('${k}')">${l}${n!==""&&n!==undefined?` <span class="badge ml-1">${n}</span>`:""}</button>`}).join("")}
function go(k){tab=TABS.some(([id])=>id===k)?k:'review';if(location.hash!=='#'+tab)location.hash=tab;drawTabs();drawHeading();render()}
window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(next!==tab)go(next)});
async function refresh(){OV=await api("/api/overview");const c=OV.counts;
 $("#sub").textContent=`${c.ready||0} ready to review - ${c.approved||0} approved - ${c.needs_you||0} need you - ${OV.applied_week} applied this week - ${OV.contacts_pending} referral notes to send`;drawTabs();
 $("#metrics").innerHTML=[["Ready to review",c.ready||0,"review"],["Need your touch",c.needs_you||0,"needs"],["Applied this week",OV.applied_week||0,"applied"],["Referral notes",OV.contacts_pending||0,"referrals"]].map(([label,n,key])=>`<button class="metric" onclick="go('${key}')"><span>${label}</span><strong>${n}</strong><span class="metric-link">${key==='review'?'Take the next step':'View details'} <span aria-hidden="true">↗</span></span></button>`).join("")}
async function run(job,arg){const r=await api("/api/run",{job,arg});if(!r.ok){toast(r.error);return}CURRUN=r.id;toast("Started: "+job);go("run")}

function geoBadge(j){if(j.geo_ok==1)return `<span class="badge bg-green-50 text-green-700 border-green-200" title="${esc(j.geo_reason)}">Open to SA</span>`;

 else if(tab=="applied"){const [jobs,fu]=await Promise.all([api("/api/jobs?status=submitted"),api("/api/followups")]);

 else if(tab=="found"){const st=FILT.found.status||"new";const qs=filtQuery("found",st);const [jobs,fa]=await Promise.all([api("/api/jobs?"+qs),api("/api/jobs/facets?"+qs)]);

  `<p class="text-sm muted mb-2">Showing ${jobs.length} of ${fa.total}. "Prepare" makes the tailored resume, cover letter and referral list for one role.</p>`+jobs.map(j=>`<div class="card p-3 mb-2 text-sm"><div class="flex justify-between gap-2"><div><b>${esc(j.title)}</b> - ${esc(j.company)} <span class="muted">(${esc(j.board)})</span>
   <div class="flex flex-wrap gap-1 mt-1">${geoBadge(j)}<span class="badge">${esc(j.family)} - ${esc(j.tier)}</span><span class="badge">fit ${Math.round(j.score||0)}</span>${j.posted_at?`<span class="badge">posted ${esc(j.posted_at)}</span>`:""}</div>
   <div class="muted text-xs mt-1">${j.status=="filtered"?"Dropped because: ":""}${esc(j.geo_reason||"")} | ${esc(j.score_reasons||"")}</div></div><div class="flex gap-1 items-start"><a class="btn" target="_blank" href="${esc(j.url)}">Open</a><button class="btn" onclick="prep('${j.id}')">Prepare</button></div></div></div>`).join("")}
 else if(tab=="referrals"){const cs=await api("/api/contacts");
  v.innerHTML=`<div class="card p-4"><p class="text-sm muted mb-2">Send 10-20 a day from LinkedIn. Recruiters first, then hiring managers. Paste the note, press Send, then Mark sent here - it updates "connections sent" in Notion.</p>${cs.map(c=>`<div class="py-1"><div class="text-xs muted mt-2">${esc(c.company)} - ${esc(c.title||"tracker row")}</div>${contactsHTML([c])}</div>`).join("")||"<p class='muted'>None yet.</p>"}</div>`}
 else if(tab=="boards"){await refresh();if(version!==renderVersion)return;
  v.innerHTML=`<div class="card overflow-x-auto"><table class="w-full text-sm"><thead class="text-left muted"><tr><th class="p-3">Board</th><th>Last run</th><th>Fetched</th><th>Matched</th><th>New</th><th>All-time new</th><th>Status</th><th></th></tr></thead><tbody>${OV.boards.map(b=>`<tr class="border-t border-zinc-100"><td class="p-3 font-medium">${esc(b.board)}</td>
   <td>${b.never_run?"never":esc((b.started||"").replace("T"," ").slice(0,16))}</td><td>${b.fetched??""}</td><td>${b.matched??""}</td><td>${b.new??""}</td><td>${b.totals?b.totals.new:""}</td>
   <td>${boardStatus(b)}</td>
   <td><button class="btn" onclick="run('board',${esc(JSON.stringify(b.board))})">Run</button></td></tr>`).join("")}</tbody></table></div>
   ${await signinCard(api)}
   <div class="card p-4 mt-3 text-sm"><b>Apply once, not scraped:</b> ${OV.not_scraped.map(esc).join(", ")}</div>`;
  v.insertAdjacentHTML("afterbegin",`<div class="card p-3 mb-3 text-sm muted">Hover a status to see the full message. <b>0 seen</b> means the site loaded but showed no roles matching your resumes this time - normal for small boards. Red means the site blocked or failed; the other boards still run.</div>`)}
 else if(tab=="run"){const runs=await api("/api/runs");
  v.innerHTML=`<div class="flex flex-wrap gap-2 mb-3"><button class="btn" onclick="run('scan')">Scan boards</button><button class="btn" onclick="run('prepare')">Prepare best new roles</button><button class="btn" onclick="run('submit')">Submit approved</button><button class="btn" onclick="run('backfill')">Backfill referrals for tracker rows</button><button class="btn" onclick="run('referrals')" title="Find people to ask for referrals, for roles in Review that have none">Find referrals for Review</button><button class="btn" onclick="run('replies')" title="Read employer replies in Gmail (read-only) and move Notion to Interview / Rejected / Offered">Check employer replies</button><button class="btn" onclick="run('expire')" title="Move roles older than 3 weeks out of Review">Clear stale roles</button><button class="btn" onclick="run('retriage')" title="Re-sort every job already found using your latest role, time-zone and employer rules">Re-sort found jobs (retriage)</button></div>
  <div class="card p-3 mb-3 text-sm">${runs.map(r=>`<div class="flex justify-between py-1 border-b border-zinc-100"><span>${esc(r.job)} ${esc(r.arg||"")} - ${esc(r.started.replace("T"," "))}</span><span><span class="badge">${esc(r.status)}</span> <button class="btn btn-ghost" onclick="CURRUN='${r.id}';render()">log</button></span></div>`).join("")||"<span class='muted'>No runs this session.</span>"}</div>
  <pre id="log" class="card p-3 text-xs h-[420px] overflow-auto bg-zinc-900 text-zinc-100"></pre>`;if(CURRUN)tail(CURRUN,0,version)}
 else if(tab=="settings"){const values=await Promise.all(["features","presets","profile","keys","config","cover_example","safeguards","cloud"].map(k=>api("/api/"+k)));[FEAT,PRE,PROF]=values;const keys=values[3],cfg=values[4],cex=values[5],sg=values[6],cl=values[7];
  v.innerHTML=`<div class="grid md:grid-cols-2 gap-3">
  <div class="card p-4 text-sm"><h3 class="font-semibold mb-2">Health</h3>
   <div id="health-status" role="status" class="muted">Checking your connections… You can edit settings while this runs.</div>
   <button class="btn mt-3" onclick="testLLM()">Test free AI providers</button><pre id="llmres" class="text-xs mt-2"></pre></div>
  <div class="card p-4 text-sm"><h3 class="font-semibold mb-2">Keys (stored only in keys.env on this PC)</h3>
   ${Object.entries(keys).map(([k,v])=>`<label class="block mt-2"><span class="text-xs muted">${k} ${v.set?"(set "+v.hint+")":"(not set)"}</span><input data-k="${k}" type="password" class="w-full mt-1" placeholder="paste to set / change"></label>`).join("")}
   <button class="btn btn-primary mt-3" onclick="saveKeys()">Save keys</button>
   <p class="text-xs muted mt-2">Gmail alerts: GMAIL_ADDRESS + a 16-letter app password from myaccount.google.com/apppasswords (needs 2-step verification on). Free keys: Gemini - aistudio.google.com/apikey. Groq - console.groq.com/keys. Cerebras - cloud.cerebras.ai. OpenRouter - openrouter.ai/keys. Notion - notion.so/my-integrations, then add the integration to Application tracker 2.1 (page ... menu > Connections).</p></div>
  <div class="card p-4 text-sm md:col-span-2"><h3 class="font-semibold mb-2">About you (used on applications and cover letters)</h3>
   <div class="grid md:grid-cols-3 gap-2">${Object.entries(PROF.fields).map(([k,v])=>`<label><span class="text-xs muted">${k.replace("_"," ")}</span><input data-p="${k}" value="${esc(v)}" class="w-full"></label>`).join("")}</div>
   <div class="mt-3 text-xs muted">Your asking rate per level (what you type here is what forms get - keep it honest)</div>
   <div class="grid grid-cols-2 md:grid-cols-5 gap-2">${["J","J-M","HM","M-S","S","ONE"].map(t=>`<label><span class="text-xs muted">${t}</span><input data-r="${t}" value="${esc(PROF.rates[t]||"")}" class="w-full" placeholder="USD 1,500/month"></label>`).join("")}</div>
   <div class="grid md:grid-cols-3 gap-2 mt-3"><label class="flex items-center gap-2"><input type="checkbox" id="p_intl" ${PROF.international_only?"checked":""}> Only overseas employers (drop SA companies and SA agencies)</label>
   <label><span class="text-xs muted">Hours you can work (SA time)</span><input id="p_win" value="${esc(PROF.work_window)}" class="w-full"></label>
   <label><span class="text-xs muted">Notion tracker link (optional)</span><input id="p_notion" value="${esc(PROF.notion_database)}" class="w-full" placeholder="paste the database link"></label></div>
   <label class="block mt-2"><span class="text-xs muted">Save tailored resumes to this folder</span><input id="p_copies" value="${esc(PROF.resume_copies)}" class="w-full"></label>
   <button class="btn btn-primary mt-3" onclick="saveProf()">Save my details</button></div>
  <div class="card p-4 text-sm md:col-span-2"><h3 class="font-semibold mb-2">Online dashboard (use Mustard Seed from your phone)</h3>
   <p class="text-xs muted mb-2">While this dashboard is open on your PC, it keeps an online copy in step every few seconds. Approve, retry, skip, mark referral notes sent or start a run from anywhere; this PC does the work.</p>
   <label class="flex items-center gap-2 py-1"><input type="checkbox" id="cl_on" ${cl.enabled?"checked":""} onchange="saveCloud()"> Keep the online dashboard in sync</label>
   <div class="py-1">Status: <b>${esc(cl.state)}</b>${cl.last_push?` - last sync ${esc(cl.last_push.replace("T"," "))}`:""}${cl.last_error?`<div class="text-red-700 text-xs mt-1">${esc(cl.last_error)}</div>`:""}</div>
   ${cl.web_url?`<div class="py-1">Link: <a class="underline" target="_blank" href="${esc(cl.web_url)}">${esc(cl.web_url)}</a></div>`:""}
   <p class="text-xs muted mt-1">${cl.has_password?"Your online password is CLOUD_PASSWORD in Keys - change it there any time.":"Set CLOUD_PASSWORD in Keys to choose your online password."}${cl.has_token?"":" CLOUD_TOKEN is missing."}</p></div>
  <div class="card p-4 text-sm md:col-span-2"><h3 class="font-semibold mb-2">Safeguards (one company, one version of you)</h3>
   <label class="flex items-center gap-2 py-1"><input type="checkbox" id="sg_on" ${sg.enabled?"checked":""}> Check every role against what you already sent to that company</label>
   <div class="flex flex-wrap items-center gap-3 py-1"><span>Look back</span><input id="sg_days" type="number" min="7" max="365" value="${esc(sg.lookback_days)}" class="w-20"><span>days. When a company already has a different resume version from you:</span>
    <label class="flex items-center gap-1"><input type="radio" name="sg_mode" value="warn" ${sg.company_mode!="skip"?"checked":""}> warn me in Review</label>
    <label class="flex items-center gap-1"><input type="radio" name="sg_mode" value="skip" ${sg.company_mode=="skip"?"checked":""}> skip the role</label></div>
   <label class="flex items-center gap-2 py-1"><input type="checkbox" id="sg_plat" ${sg.platform_rule?"checked":""}> Agencies and talent platforms get one resume family only (strongest match wins)</label>
   <label class="flex items-center gap-2 py-1"><input type="checkbox" id="sg_ref" ${sg.referral_dedup?"checked":""}> Never draft a second referral note to someone already lined up for another role</label>
   <label class="block mt-2"><span class="text-xs muted">Agencies / talent platforms (one per line)</span><textarea id="sg_list" class="w-full h-28 text-xs">${esc((sg.platforms||[]).join("\n"))}</textarea></label>
   <button class="btn btn-primary mt-2" onclick="saveSafe()">Save safeguards</button></div>
  <div class="card p-4 text-sm"><h3 class="font-semibold mb-2">Features (switch off what you don't use)</h3>
   ${Object.entries(FEAT).map(([k,on])=>`<label class="flex justify-between py-1 border-b border-zinc-100"><span>${FEATLABEL[k]||k}</span><input type="checkbox" data-f="${k}" ${on?"checked":""} onchange="saveFeat()"></label>`).join("")}</div>
  <div class="card p-4 text-sm"><h3 class="font-semibold mb-2">Resume families</h3>
   ${Object.entries(PRE.families).map(([f,t])=>`<div class="py-1 border-b border-zinc-100 flex justify-between"><span><b>${esc(f)}</b> <span class="muted">levels: ${t.map(esc).join(", ")}</span></span><button class="btn btn-ghost" onclick="rmFam('${esc(f)}')">remove</button></div>`).join("")}
   <div class="flex gap-2 mt-3"><select id="preset">${Object.entries(PRE.presets).filter(([k])=>!PRE.families[k]).map(([k,l])=>`<option value="${k}">${esc(l)}</option>`).join("")}</select><button class="btn" onclick="addFam()">Add family</button></div>
   <div class="mt-4 font-medium">Upload a master resume (.docx)</div><div class="flex flex-wrap gap-2 mt-1"><select id="up_f" onchange="upTiers()">${Object.keys(PRE.families).map(f=>`<option>${esc(f)}</option>`).join("")}</select><select id="up_t"></select><input id="up_file" type="file" accept=".docx"><button class="btn" onclick="upMaster()">Upload</button></div>
   <p class="text-xs muted mt-1">One file per level. The engine only ever edits copies - your masters stay untouched.</p></div>
  <div class="card p-4 text-sm md:col-span-2"><h3 class="font-semibold mb-2">Cover letter example</h3>
   <p class="text-xs muted mb-2">Paste one of your own best cover letters. Every new cover letter copies its structure, tone and sign-off, then fills it with facts from the resume used for that job. Numbers or claims from this example are never copied - if a sentence states a figure that isn't on your resume, it is removed.</p>
   <textarea id="cex" class="w-full h-64 text-sm">${esc(cex.text)}</textarea><button class="btn btn-primary mt-2" onclick="saveCex()">Save example</button></div>
  <div class="card p-4 text-sm md:col-span-2"><h3 class="font-semibold mb-2">config.json</h3><p class="text-xs muted mb-2">Boards, search terms, filters, your profile answers, rates per tier, schedule.</p><textarea id="cfg" class="w-full h-[480px] font-mono text-xs">${esc(cfg.text)}</textarea><button class="btn btn-primary mt-2" onclick="saveCfg()">Save config</button></div></div>`;upTiers();loadHealth(version)}
}
async function loadHealth(version,force=false){try{const h=await api('/api/health'+(force?'?force=1':''));if(version!==renderVersion||tab!=='settings')return;HEALTH=h;
 const rows=[["Referral search",h.searxng?'Connected':'Browser search fallback'],["Notion tracker",h.notion],["PDF export",h.pdf],["Offline AI",h.ollama?(h.ollama.join(', ')||'No models installed'):'Not running (optional)'],["Master resumes",h.masters.length+' files'],["Output folder",h.resume_copies]];
 $("#health-status").innerHTML=rows.map(([label,value])=>`<div class="health-row"><span>${esc(label)}</span><span>${esc(value)}</span></div>`).join('')+`<button class="btn mt-3" onclick="loadHealth(renderVersion,true)">Refresh connections</button>`;
 }catch(error){if(version===renderVersion&&tab==='settings')$("#health-status").innerHTML=`<p>${esc(error.message)}</p><button class="btn mt-3" onclick="loadHealth(renderVersion,true)">Retry connection check</button>`}}
let PROF={fields:{},rates:{}};
async function saveProf(){const f={},r={};document.querySelectorAll("[data-p]").forEach(i=>f[i.dataset.p]=i.value);document.querySelectorAll("[data-r]").forEach(i=>{if(i.value)r[i.dataset.r]=i.value});
 const x=await api("/api/profile",{fields:f,rates:r,international_only:$("#p_intl").checked,work_window:$("#p_win").value,notion_database:$("#p_notion").value,resume_copies:$("#p_copies").value});toast(x.ok?"Saved":x.error)}
let FEAT={},PRE={presets:{},families:{}};
const FEATLABEL={scan_boards:"Scan job boards",email_alerts:"Read job-alert emails (Gmail)",ai_tailoring:"AI resume tailoring + cover letters",referrals:"Find referral contacts",notion:"Update Notion tracker",auto_fill:"Fill application forms after I approve"};
async function saveFeat(){const b={};document.querySelectorAll("[data-f]").forEach(i=>b[i.dataset.f]=i.checked);await api("/api/features",b);toast("Saved")}
async function addFam(){const r=await api("/api/family/add",{preset:$("#preset").value});toast(r.ok?"Added - now upload its resumes: "+r.masters_needed.join(", "):r.error);render()}
async function rmFam(f){if(!confirm("Stop looking for "+f+" roles? (Your resume files stay.)"))return;const r=await api("/api/family/remove",{family:f});toast(r.ok?"Removed":r.error);render()}
function upTiers(){const f=$("#up_f").value;$("#up_t").innerHTML=(PRE.families[f]||[]).map(t=>`<option>${esc(t)}</option>`).join("")}
async function upMaster(){const f=$("#up_file").files[0];if(!f){toast("Choose a .docx first");return}const buf=new Uint8Array(await f.arrayBuffer());let bin="";for(let i=0;i<buf.length;i+=32768)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+32768));
 const r=await api("/api/master/upload",{family:$("#up_f").value,tier:$("#up_t").value,data_b64:btoa(bin)});toast(r.ok?"Saved as "+r.saved:r.error);render()}
async function approveAll(){const r=await api("/api/approve_all",{min_score:+$("#ms").value});toast(`Approved ${r.approved}`+(r.held?` - ${r.held} held back with a same-company warning (approve those one by one)`:""));render();refresh()}
async function saveCloud(){await api("/api/cloud",{enabled:$("#cl_on").checked});toast("Saved");setTimeout(render,1500)}
async function saveSafe(){const b={enabled:$("#sg_on").checked,platform_rule:$("#sg_plat").checked,referral_dedup:$("#sg_ref").checked,company_mode:document.querySelector("input[name=sg_mode]:checked").value,lookback_days:$("#sg_days").value,platforms:$("#sg_list").value.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean)};await api("/api/safeguards",b);toast("Saved")}
async function tail(id,off,version){if(tab!="run"||CURRUN!=id||version!==renderVersion)return;const r=await api(`/api/run/${id}/log?offset=${off}`);const l=$("#log");if(!l||tab!=="run"||CURRUN!==id||version!==renderVersion)return;if(off==0)l.textContent="";l.textContent+=r.text;l.scrollTop=l.scrollHeight;
 if(r.status=="running")setTimeout(()=>tail(id,r.offset,version),1500);else{refresh()}}
async function testLLM(){const output=$("#llmres");output.textContent="testing...";try{output.textContent=JSON.stringify(await api("/api/llm"),null,1)}catch(error){output.textContent=error.message}}
async function saveKeys(){const b={};document.querySelectorAll("[data-k]").forEach(i=>{if(i.value)b[i.dataset.k]=i.value});await api("/api/keys",b);toast("Saved");render()}
async function saveCex(){await api("/api/cover_example",{text:$("#cex").value});toast("Saved - the next prepared roles use it")}
async function saveCfg(){const r=await api("/api/config",{text:$("#cfg").value});toast(r.ok?"Saved":"Not saved: "+r.error)}
go(tab);refresh().catch(e=>toast(e.message));setInterval(()=>refresh().catch(e=>toast(e.message)),30000);
</script>
